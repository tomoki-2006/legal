<!doctype html>
<html lang="ja">
<head>

<title>Legal</title>
<style>
:root { color-scheme: light dark; }
body { margin: 0; padding: 0; background: #fafafa; color: #1c1c1e;

  body { background: #0b0b0d; color: #f2f2f7; }
